<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chifaa AI — Hospital Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['IBM Plex Sans', 'IBM Plex Sans Arabic', 'system-ui', 'sans-serif'],
            arabic: ['IBM Plex Sans Arabic', 'IBM Plex Sans', 'sans-serif'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            ink:    { 900: '#0B2545', 700: '#1E3A5F', 500: '#4A5B73', 400: '#6B7A8F', 300: '#9AA6B8' },
            paper:  { 50: '#F4F7FB', 100: '#EAF0F7', 200: '#DCE5F0', 300: '#C7D3E2' },
            sky:    { 50: '#EEF4FF', 100: '#DDE8FF', 500: '#2E5BFF', 600: '#1E47E0', 700: '#1839B5' },
            mint:   { 50: '#E8F7F0', 100: '#C9EEDC', 500: '#10B981', 600: '#0E9E70', 700: '#0B7A57' },
            alert:  { 50: '#FFF1F2', 100: '#FFE0E3', 500: '#E11D48', 600: '#C8123B', 700: '#A30E32' },
            amber:  { 50: '#FFF8E6', 100: '#FFEFC2', 500: '#F59E0B' },
          },
          boxShadow: {
            'soft':  '0 1px 2px rgba(11,37,69,0.04), 0 4px 16px rgba(11,37,69,0.06)',
            'card':  '0 2px 4px rgba(11,37,69,0.04), 0 12px 32px rgba(11,37,69,0.08)',
            'pop':   '0 8px 24px rgba(46,91,255,0.18), 0 2px 6px rgba(46,91,255,0.16)',
            'mic':   '0 12px 40px rgba(46,91,255,0.32), 0 4px 12px rgba(46,91,255,0.22)',
          },
          borderRadius: { 'xl2': '20px', 'xl3': '28px' },
        }
      }
    }
  </script>

  <style>
    html, body { background: #EEF2F8; }
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0B2545; -webkit-font-smoothing: antialiased; }
    [dir="rtl"] { font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; }

    /* breathing mic */
    @keyframes pulse-ring {
      0%   { transform: scale(0.9); opacity: 0.7; }
      80%  { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .pulse-ring { animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    .pulse-ring.d2 { animation-delay: 0.6s; }
    .pulse-ring.d3 { animation-delay: 1.2s; }

    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .breathe { animation: breathe 2.6s ease-in-out infinite; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .wave-bar { transform-origin: center; animation: wave 0.9s ease-in-out infinite; }

    @keyframes thinking-dot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    .think-dot { animation: thinking-dot 1.2s ease-in-out infinite; }

    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fade-up 0.35s ease-out both; }

    /* shimmer placeholder */
    .stripe-ph { background-image: repeating-linear-gradient(45deg, #E6ECF5 0 8px, #EEF3FA 8px 16px); }

    /* phone scroll inner shadow hint */
    .phone-shell::-webkit-scrollbar { width: 0px; }

    /* hide html scrollbar but keep scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* focus rings */
    button:focus-visible, [role="button"]:focus-visible {
      outline: 3px solid #2E5BFF; outline-offset: 3px; border-radius: 14px;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens/landing.jsx"></script>
  <script type="text/babel" src="screens/voice.jsx"></script>

  <script type="text/babel" src="screens/checklist.jsx"></script>
  <script type="text/babel" src="screens/guidance.jsx"></script>
  <script type="text/babel" src="screens/emergency.jsx"></script>
  <script type="text/babel" src="screens/settings.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
